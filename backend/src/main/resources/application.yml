server:
  port: 8080

spring:
  application:
    name: nhi-connect
  datasource:
    url: jdbc:postgresql://localhost:5432/nhiconnect
    username: nhi
    password: nhi_dev_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

nhi:
  cors:
    allowed-origin: http://localhost:5173
  auth:
    session-hours: 8
