server:
  port: 8080

spring:
  application:
    name: nhi-connect
  datasource:
    url: jdbc:postgresql://localhost:5432/nhiconnect
    username: nhi
    password: nhi_dev_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

nhi:
  cors:
    allowed-origin: http://localhost:5173
  auth:
    session-hours: 8
    max-failed-sign-ins: 5   # then the username is locked ...
    lockout-minutes: 15      # ... for this long (an admin password reset also unlocks)
# Demo-account passwords are NOT kept here: see DemoUserSeeder (environment variables NHI_DEMO_*_PASSWORD).
